<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoChain - Login</title>
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body class="backg">
    <div class="janela">
        <div class="header">
            <div class="headerVoltar">
                <a href=""><img src="img/chevronLeft.png" alt="Voltar" class="chevron"></a>
                <img src="img/logo.png" alt="ThermoChain" class="logo">
            </div>
            <div class="subtext">
                <img src="img/check.png" alt="check" class="check">
                <span>Controle Térmico de ponta a ponta</span>
            </div>
        </div>


        <div>
            <div class="container">
                <label>E-mail</label><br>
                <div>
                    <input type="text" id="ipt_email" placeholder="Exemplo@exemplo.com" class="input email">
                </div>

                <div>
                    <div class="senhaTitle">
                        <span>Senha</span>
                        <a href="">Recuperar senha</a>
                    </div>
                    <div class="inputContainer">
                        <input type="password" id="ipt_senha" class="input senha" placeholder="Digite sua senha">
                        <img src="img/olhoIcon.png" id="olho" class="olho">
                    </div>
                </div>

                <input type="checkbox">
                <label for="">Lembrar de mim</label><br><br>

                <button onclick="entrar()" class="botao">Entrar</button>
            </div>


            <div class="footer">
                <span>Ainda nao tem uma conta? </span>
                <a href="cadastro.html">Solicite acesso já!</a>
            </div>
        </div>
    </div>
</body>
</html>
