<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoChain - Login</title>
    <link rel="stylesheet" href="../CSS/styleLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" href="../CSS/img/ThermoChain Logo.png" type="image/png">

</head>

<body class="backg B_Login">
    <div class="janela">
        <div class="header">
            <div class="headerVoltar">
                <a href="Tela_home.html"><img src="../CSS/img/seta-esquerda.png" alt="Voltar" class="chevron"></a>
                <img src="../CSS/img/logo.png" alt="ThermoChain" class="logo">
            </div>
            <div class="subtext">
                <img src="../CSS/img/check.png" alt="check" class="check">
                <span>Controle Térmico de ponta a ponta</span>
            </div>
        </div>


        <div>
            <div class="container">
                <label>E-mail</label><br>
                <div>
                    <input type="text" id="ipt_email" placeholder="Exemplo@exemplo.com" class="input email"
                        autocomplete="off">
                </div>
                <div id="div_emailErro" class="erro"></div>

                <label for="">Codigo Empresa</label>
                <div>
                    <input type="text" id="ipt_codigoEmpresa" placeholder="ABCD12" class="input codigo" autocomplete="off">
                </div>
                <div>
                    <div class="senhaTitle">
                        <span>Senha</span>
                        <a href="">Recuperar senha</a>
                    </div>
                    <div class="inputContainer">
                        <input type="password" id="ipt_senha" class="input senha" placeholder="Digite sua senha"
                            autocomplete="off">
                        <img src="../CSS/img/olhoIcon.png" id="olho" class="olho">
                    </div>
                </div>
                <label>Código da empresa</label>
                <div class="inputContainer">
                    <input type="password" id="ipt_codigoempresa" class="input senha" placeholder="Digite seu código"
                        autocomplete="off">

                </div>

                <div id="div_senhaErro" class="erro"></div>
            </div>

            <input type="checkbox">
            <label for="">Lembrar de mim</label><br><br>
            <div id="cardErro" style="display:none;">
                <span id="mensagem_erro"></span>
            </div>
            <button onclick="entrar()" class="botao" id="btn_entrar">Entrar</button>
        </div>


        <div class="footer">
            <span>Ainda nao tem uma conta? </span>
            <a href="cadastro.html">Solicite acesso já!</a>
        </div>
    </div>
    </div>
    <script src="../JS/scriptLogin.js"></script>
</body>





















</html>
