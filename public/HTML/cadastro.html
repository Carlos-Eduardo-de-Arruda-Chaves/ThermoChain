<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoChain - Cadastro</title>

    <link rel="stylesheet" href="../CSS/stylecadastro.css">
</head>

<body class="B_Cadastro">

    <div class="container">

        <div class="header">

            <div class="headerVoltar">

                <a href="Tela_home.html">
                    <img src="../CSS/img/seta-esquerda.png"
                        alt="Voltar"
                        class="chevron">
                </a>

                <img src="../CSS/img/logo.png"
                    alt="ThermoChain"
                    class="logo">

            </div>

            <div class="subtext">

                <img src="../CSS/img/check.png"
                    alt="check"
                    class="check">

                <span>
                    Controle Térmico de ponta a ponta
                </span>

            </div>

        </div>


        <div class="campo">

            <h3>Nome</h3>

            <img src="../CSS/img/userIcon.png"
                class="email">

            <div class="input-box">

                <input type="text"
                    id="input_usuario"
                    placeholder="Digite seu nome">

            </div>

            <div id="div_usuarioErro"
                class="erro"></div>

        </div>


        <div class="campo">

            <h3>E-mail</h3>

            <img src="../CSS/img/emailIcon.png"
                class="email">

            <div class="input-box">

                <input type="email"
                    id="input_email"
                    placeholder="Exemplo@thermochain.com">

            </div>

            <div id="div_emailErro"
                class="erro"></div>

        </div>


        <div class="campo">

            <h3>Senha</h3>

            <img src="../CSS/img/olhoIcon.png"
                class="olho"
                onclick="mostrarSenha('input_senha')">

            <div class="input-box">

                <input type="password"
                    id="input_senha"
                    placeholder="Digite sua senha">

            </div>

            <div id="div_senhaErro"
                class="erro"></div>

        </div>


        <div class="campo">

            <h3>Confirmar Senha</h3>

            <img src="../CSS/img/olhoIcon.png"
                class="olho"
                onclick="mostrarSenha('input_confsenha')">

            <div class="input-box">

                <input type="password"
                    id="input_confsenha"
                    placeholder="Confirme sua senha">

            </div>

            <div id="div_confSenhaErro"
                class="erro"></div>

        </div>


        <div class="button">

            <button onclick="cadastrar()">
                CADASTRAR
            </button>

        </div>


        <div class="alerta">

            <div id="alerta"></div>

            <h4>Já tem uma conta?</h4>

        </div>

        <a href="../HTML/login.html">
            Faça Login
        </a>

    </div>

    <script src="../JS/scriptCadastro.js"></script>

</body>

</html>
