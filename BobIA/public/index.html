<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BobIA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <h1>BobIA</h1>
        <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
        <br><br>
        <button id="botaoGerar" onclick="gerarResposta()">Gerar Resposta</button>

        <div id="loadingMessage" style="display: none;">
            Carregando resposta... Por favor, aguarde. <span class="spinner">⏳</span>
        </div>

        <h3>Resposta da IA:</h3>
        <div id="resposta"></div>
    </div>

    <script>
        
        async function gerarResposta() {
            const pergunta = document.getElementById('pergunta').value;
            const loadingMessage = document.getElementById('loadingMessage');
            const responseArea = document.getElementById('resposta');
            const askButton = document.getElementById('botaoGerar');

            loadingMessage.style.display = 'block';
            responseArea.textContent = '';
            askButton.disabled = true;

            try {
                const response = await fetch('/perguntar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pergunta })
                });

                const data = await response.json();
                responseArea.style.display = 'block';
                responseArea.innerText = data.resultado || 'Nenhuma resposta recebida.';
            } catch (error) {
                responseArea.style.display = 'block';
                responseArea.innerText = 'Ocorreu um erro ao carregar a resposta: ' + (error.message || error);
                console.error('Erro na chamada à API:', error);
            } finally {
                loadingMessage.style.display = 'none';
                askButton.disabled = false;
            }
        }

    </script>
    
</body>
</html>
