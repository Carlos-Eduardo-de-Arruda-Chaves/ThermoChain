<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="dashStyle.css">
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <a href="../Tela_home.html">
            <img src="../img/seta-esquerda.png" class="imgBack">
        </a>
        <div class="logoContainer">
            <img src="../img/logoImg.png" class="logo">
            <img src="../img/logotipo.png" class="logoTipo">
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">

        <!-- TÍTULO -->
        <div class="titleContainer">
            <h1 class="dashTitle">Dashboard</h1>
        </div>

        <!-- KPIs -->
        <div class="kpis">

            <!-- CARD 1 -->
            <div class="card_kpi">
                <span class="kpi_label">Registro de temperatura</span>
            </div>

            <!-- CARD 2 -->
            <div class="card_kpi">
                <span class="kpi_label">Temperatura:</span>
                <span class="kpi_value">9.2°C</span>
            </div>

            <!-- CARD 3 -->
            <div class="card_kpi">
                <button class="btn_detalhes">Detalhes</button>
            </div>

        </div>

        <!-- GRÁFICO -->
        <div class="grafico_card">
            <h3>Registros do sensor</h3>
            <canvas id="sensorAnalogico"></canvas>
        </div>

        <!-- STATUS -->
        <div class="status">

            <!-- CARD STATUS -->
            <div class="card_status">
                <span class="status_label"><strong>Status:</strong></span>
                <span class="status_value">Temperatura acima da média</span>
            </div>

            <!-- CARD FALHA -->
            <div class="card_status">
                <span class="status_label"><strong>Tipo de falha:</strong></span>
                <span class="status_value">Temperatura elevada</span>
            </div>

        </div>

    </div>

    <script src="dash.js"></script>

</body>

</html>
